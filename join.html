<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="You've been invited to join a chat room on H.I.M.">
<meta property="og:title" content="You've been invited — H.I.M.">
<meta property="og:description" content="Someone invited you to a chat room on H.I.M., the friendship-first app for gay men.">
<meta property="og:url" content="https://hiitsme.app/join/">
<meta property="og:type" content="website">
<title>Join H.I.M.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13100E;
  --bg-card: #1D1916;
  --text: #F7F0E8;
  --text-muted: #BEB2A5;
  --text-muted-soft: #9C8E82;
  --rose: #E8608A;
  --gold: #D4963A;
  --border: rgba(255,255,255,0.07);
  --rose-glow: rgba(232,96,138,0.12);
  --gold-glow: rgba(212,150,58,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  overflow-x: hidden;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.glow-rose {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,96,138,0.14) 0%, transparent 70%);
  top: -120px;
  right: -100px;
  pointer-events: none;
  z-index: 0;
}

.glow-gold {
  position: fixed;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,150,58,0.10) 0%, transparent 70%);
  bottom: -80px;
  left: -80px;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem 2rem;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 64px rgba(0,0,0,0.5);
}

.wordmark {
  font-family: 'DM Serif Display', serif;
  font-size: 1.1rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2rem;
}

.wordmark span {
  color: var(--rose);
}

h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 2rem;
  line-height: 1.15;
  margin-bottom: 0.75rem;
  color: var(--text);
}

.subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 2rem;
}

.btn-primary {
  display: block;
  width: 100%;
  padding: 0.875rem 1.5rem;
  background: var(--rose);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  margin-bottom: 0.75rem;
  transition: opacity 0.15s;
}

.btn-primary:hover { opacity: 0.88; }

.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 1.25rem 0;
  color: var(--text-muted-soft);
  font-size: 0.8rem;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.store-row {
  display: flex;
  gap: 0.75rem;
}

.btn-store {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  padding: 0.875rem 0.5rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  font-size: 0.8rem;
  color: var(--text-muted);
  transition: background 0.15s, border-color 0.15s;
}

.btn-store:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.14);
}

.btn-store svg {
  width: 22px;
  height: 22px;
  fill: var(--text-muted);
}

.btn-store strong {
  display: block;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text);
}

.status-msg {
  margin-top: 1.5rem;
  font-size: 0.8rem;
  color: var(--text-muted-soft);
  min-height: 1.2em;
}

.back-link {
  position: relative;
  z-index: 1;
  margin-top: 1.5rem;
  font-size: 0.85rem;
  color: var(--text-muted-soft);
  text-decoration: none;
}

.back-link:hover { color: var(--text-muted); }
</style>
</head>
<body>

<div class="glow-rose"></div>
<div class="glow-gold"></div>

<div class="card">
  <div class="wordmark">H<span>.</span>I<span>.</span>M<span>.</span></div>

  <h1>You've been<br><em>invited.</em></h1>
  <p class="subtitle">Someone shared a chat room with you on H.I.M., the friendship-first social app for gay men.</p>

  <a id="openAppBtn" href="#" class="btn-primary">Open in H.I.M.</a>

  <div class="divider">don't have the app?</div>

  <div class="store-row">
    <a id="iosStoreLink" href="https://apps.apple.com/app/id6448872101" class="btn-store" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      <strong>App Store</strong>
      iPhone &amp; iPad
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.hiitsme.app" class="btn-store" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.18 23.76c.3.17.64.24.99.2l12.6-12.6L13.41 8l-10.23 15.76zm17.29-10.65L17.6 11.5l-3.41 3.42 3.41 3.41 2.9-1.64a1.83 1.83 0 0 0 0-3.18zM2.46 1.27a1.8 1.8 0 0 0-.27.98v19.5c0 .34.09.67.27.97L13.4 11.5 2.46 1.27zm11.8.84L2.64.27A1.81 1.81 0 0 0 1.27.47L13.4 11.5l3.37-3.37-2.51-5.02z"/>
      </svg>
      <strong>Google Play</strong>
      Android
    </a>
  </div>

  <p class="status-msg" id="statusMsg"></p>
</div>

<a href="https://hiitsme.app" class="back-link">← hiitsme.app</a>

<script>
(function () {
  var inviteCode = window.location.pathname.replace(/^\/join\//, '').replace(/\/$/, '');
  var deepLink = 'hiitsme://localhost/join/' + inviteCode;
  var webFallback = 'https://hiitsme-app.vercel.app/join/' + inviteCode;

  var btn = document.getElementById('openAppBtn');
  var statusMsg = document.getElementById('statusMsg');

  btn.href = deepLink;

  btn.addEventListener('click', function (e) {
    e.preventDefault();

    // Try the custom scheme; if not installed the browser will do nothing or show an error.
    // We fall back to the web app after a short delay.
    var fallbackTimer = setTimeout(function () {
      statusMsg.textContent = "Looks like H.I.M. isn't installed. Download it below to join.";
    }, 1800);

    window.addEventListener('blur', function onBlur() {
      clearTimeout(fallbackTimer);
      window.removeEventListener('blur', onBlur);
    }, { once: true });

    window.location.href = deepLink;
  });

  // iOS Safari can follow universal links directly — patch the App Store link
  // to carry the invite code so a freshly-installed app can re-open the invite.
  var iosLink = document.getElementById('iosStoreLink');
  if (iosLink && inviteCode) {
    iosLink.href = 'https://apps.apple.com/app/id6448872101';
  }
})();
</script>
</body>
</html>
